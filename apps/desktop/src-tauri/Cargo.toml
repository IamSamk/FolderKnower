[package]
name = "architekton-desktop"
description = "Architekton desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "architekton_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-updater = "2"
ark-core = { workspace = true }
ark-ontology = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "3.5.1", default-features = false, features = ["json", "rustls"] }
sha2 = "0.11.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
flate2 = "1.1.11"
tar = "0.4.46"

[lints]
workspace = true
